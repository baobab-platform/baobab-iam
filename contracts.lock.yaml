# The baobab-platform/shared contracts this engine implements or consumes
# (EA Plan v2.0 EA-01A; schema: shared .baobab/contract-consumer-lock.schema.json).
# Foundation checks that the commit is on Shared main and that every listed
# contract exists and parses there. tests/integration/run.sh section 9 reads
# workload-registry.yaml at this commit.
#
# The pin includes the PROVISIONED federated_workload_token identities for
# baobab-cp-workload, baobab-subscriptions-workload and the production
# deployment controller, the current scope vocabulary (including the
# administrator:read/write/approve scopes this repository issues, iam#50 and
# iam#51), the provider-neutral identity/v1 capability contracts (shared#151)
# and evidence-backed workload activation (shared#148).
#
# erp:read and erp:provision (the ERP Boundary API, shared#206) are issued to baobab-erp-workload only and carry no tenant_id.
#
# MP2-C extends the pin to merged Shared MP2-A/B. No workload/scope allocation
# or lifecycle promotion is implied.
# EA-01 reconciliation (2026-10-04): 10810e2 -> 6899a2d. Existing scope
# entries and workload records are unchanged; context:validate is catalogued
# but granted to no workload. See docs/governance/ea-01-shared-pin-reconciliation.md.
#
# Every scope this repository issues must exist in the scope registry at this
# exact commit: scripts/check-issued-scopes.sh, run in CI and in
# tests/integration/run.sh section 9b.
schema: baobab-contract-consumer-lock
version: "1.0"
source:
  repository: baobab-platform/shared
  commit: b10388460c23ac6d7d99bb8a22e2ee4821ad22f6
contracts:
  # Accepted MP2-A/B provider-neutral federation consumption contracts.
  - contracts/identity/v1/provider-runtime-profile.schema.json
  - contracts/identity/v1/runtime-capability.schema.json
  - contracts/identity/v1/federation-domain.schema.json
  - contracts/identity/v1/federation-trust.schema.json
  - contracts/identity/v1/federation-lifecycle.yaml
  - contracts/identity/v1/external-principal.schema.json
  - contracts/identity/v1/federated-assurance.schema.json
  - contracts/identity/v1/principal.schema.json
  - contracts/identity/v1/external-identity.schema.json
  - contracts/identity/v1/authentication-assurance.schema.json
  - contracts/capability/v1/provider.schema.json
  - contracts/capability/v1/binding.schema.json
  - contracts/capability/v1/domain.schema.json
  - contracts/control-plane/v1/domain.schema.json
  # Scope vocabulary the provider adapters grant (internal/provider/validate.go).
  - contracts/authorization/v1/scope-registry.yaml
  # Token profile IAM issues (ADR-0006): claims and required-claim policy.
  - contracts/control-plane/v1/access-token-claims.schema.json
  - contracts/control-plane/v1/security-policy.yaml
  # Capabilities declared in .baobab/capability-provider.yaml.
  - contracts/identity/v1/capabilities.yaml
  # Canonical workloads, credential types and allowed scopes (ADR-0007).
  - contracts/identity/v1/workload-registry.yaml
policy:
  updates: explicit_pull_request
  compatibility: validate_before_merge
