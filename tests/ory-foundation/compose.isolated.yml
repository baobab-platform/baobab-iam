# Disposable Foundation only. The runner reaches providers via fixed loopback
# relays. Containers can reach only the internal subnet and its host gateway.
networks:
  default:
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.146.0/28
          gateway: 172.30.146.1
          ip_range: 172.30.146.8/29

services:
  postgres-kratos:
    ports: !reset []
  postgres-hydra:
    ports: !reset []
  kratos:
    ports: !reset []
    environment:
      # Browser flow cookies and WebAuthn must share the localhost hostname.
      SERVE_PUBLIC_BASE_URL: http://localhost:4433/
    networks:
      default:
        ipv4_address: 172.30.146.2
  hydra:
    ports: !reset []
    networks:
      default:
        ipv4_address: 172.30.146.3
    extra_hosts:
      - "host.docker.internal:172.30.146.1"
