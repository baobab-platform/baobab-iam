# ADR-IAM-0033 construction evidence, not CP activation or certification.
# PARTIAL accurately records executable work without claiming the complete
# canonical capability contract. Shared excludes PARTIAL from registration.
# Provider keys describe implementations; actual provider IDs and runtime
# instances are allocated by CP. No synthetic runtime IDs are published here.
# production_permitted is eventual eligibility, never production acceptance.
schema:
  name: baobab-capability-provider-declaration
  version: '1.0'
engine:
  engine_id: baobab-iam
providers:
- provider_key: baobab-iam.kratos
  name: Kratos native identity
  description: Native credential and session mechanics exist; canonical browser authorization
    and estate acceptance remain incomplete.
  provider_type: ADAPTER
  simulated: false
  production_permitted: true
  provenance:
    authority:
      repository: baobab-platform/baobab-iam
      decision: ADR-IAM-0033
  support:
  - capability_key: identity.authentication.perform
    contract_versions:
    - 1
    implementation_status: PARTIAL
    implementation_evidence:
    - type: source
      path: internal/provider/ory/kratos.go
    - type: integration-test
      path: internal/provider/ory/foundation_live_test.go
  implementation_key: kratos
- provider_key: baobab-iam.hydra
  name: Hydra OAuth and workloads
  description: Client and projected-assertion issuance mechanics exist; the isolated Hydra audience
    candidate passes CP verifier acceptance. Canonical issuance dispatch and live registered
    resource consumption remain open.
  provider_type: ADAPTER
  simulated: false
  production_permitted: true
  provenance:
    authority:
      repository: baobab-platform/baobab-iam
      decision: ADR-IAM-0033
  support:
  - capability_key: identity.workload-token.issue
    contract_versions:
    - 1
    implementation_status: PARTIAL
    implementation_evidence:
    - type: source
      path: internal/provider/ory/hydra.go
    - type: integration-test
      path: internal/provider/ory/hydra_federated_workload_test.go
    - type: integration-test
      path: internal/provider/ory/token_profile_live_test.go
  implementation_key: hydra
- provider_key: baobab-iam.keycloak
  name: Permanent enterprise federation and SSO
  description: OIDC/SAML brokering exists; complete canonical authentication handoff, login
    discovery and estate acceptance remain open.
  provider_type: ADAPTER
  simulated: false
  production_permitted: true
  provenance:
    authority:
      repository: baobab-platform/baobab-iam
      decision: ADR-IAM-0033
  support:
  - capability_key: identity.authentication.perform
    contract_versions:
    - 1
    implementation_status: PARTIAL
    implementation_evidence:
    - type: source
      path: internal/provider/keycloak/enterprise.go
    - type: integration-test
      path: internal/provider/keycloak/enterprise_live_test.go
  implementation_key: keycloak
planned_capabilities:
- proposed_key: identity.human.provision
  proposal_status: PROPOSED
  description: Create or import a human identity in the configured IdP without embedding Tenant,
    LegalEntity, or Capability business state (ADR-IAM-0020/0021).
  target_provider_key: baobab-iam.kratos
  provenance:
    authority:
      repository: baobab-platform/baobab-iam
      decision: ADR-IAM-0020
- proposed_key: identity.human.disable
  proposal_status: PROPOSED
  description: Mark a human identity inactive so it cannot authenticate (provider half of kill-switch;
    CP membership revocation remains separate).
  target_provider_key: baobab-iam.kratos
  provenance:
    authority:
      repository: baobab-platform/baobab-iam
      decision: ADR-IAM-0020
- proposed_key: identity.session.revoke
  proposal_status: PROPOSED
  description: Invalidate provider-side sessions for a human subject (technical kill-switch).
  target_provider_key: baobab-iam.kratos
  provenance:
    authority:
      repository: baobab-platform/baobab-iam
      decision: ADR-IAM-0020
- proposed_key: identity.workload.provision
  proposal_status: PROPOSED
  description: Create or update a workload OAuth client with stable logical client_id and freeze-list
    scopes (ADR-IAM-0019 workloads-first; ADR-0007).
  target_provider_key: baobab-iam.hydra
  provenance:
    authority:
      repository: baobab-platform/baobab-iam
      decision: ADR-IAM-0019
- proposed_key: identity.workload.disable
  proposal_status: PROPOSED
  description: Soft-disable a workload client so it cannot obtain tokens.
  target_provider_key: baobab-iam.hydra
  provenance:
    authority:
      repository: baobab-platform/baobab-iam
      decision: ADR-IAM-0020
- proposed_key: identity.workload.rotate
  proposal_status: PROPOSED
  description: Rotate workload client credentials without changing logical client_id.
  target_provider_key: baobab-iam.hydra
  provenance:
    authority:
      repository: baobab-platform/baobab-iam
      decision: ADR-IAM-0020
- proposed_key: identity.migration.map
  proposal_status: CANDIDATE
  description: Map source issuer+subject to canonical identity and target issuer+subject without
    email-only resolution (ADR-IAM-0022). CP remains SoR for Principal.
  target_provider_key: baobab-iam.ory
  provenance:
    authority:
      repository: baobab-platform/baobab-iam
      decision: ADR-IAM-0022
