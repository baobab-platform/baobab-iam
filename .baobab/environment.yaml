# Baobab Development Environment Contract
#
# Purpose:
#   Declares the minimum baobab-dev environment required to develop,
#   build and test this repository.
#
# This file does NOT describe:
#   - Baobab domain/business capabilities;
#   - Control Plane CapabilityProviders;
#   - production deployment topology;
#   - application dependencies (Keycloak vs Ory runtime choice).
#
# Canonical schema:
#   baobab-platform/shared/contracts/development-environment/schema.yaml
#
# baobab-dev capability source:
#   baobab-platform/baobab-dev/config/capabilities.yaml
#
# Guidance: baobab-platform/engine-template/.baobab/environment.yaml.example

schema:
  name: "baobab-platform-development-environment-contract"
  version: "1.0"

application:
  # Repository/application identifier (repository slug).
  name: "baobab-iam"
  # Repository/application release version, NOT the baobab-dev version.
  version: "0.1.0"

environment:
  provider: "baobab-dev"
  # Backend/headless engine — full profile (engine-template guidance).
  profile: "full"
  # Must match the image tag pinned in .devcontainer/devcontainer.json
  # (ghcr.io/baobab-platform/baobab-dev:<minimum_version>).
  minimum_version: "1.4.4"
  contract_minimum_version: "1.0"

compatibility_policy:
  strict_runtime_versions: true
  allow_newer_patch_versions: true
  allow_newer_minor_versions: false
  allow_older_versions: false

validation:
  # ONLY baobab-dev development capabilities actually required by this repo.
  # Canonical dotted leaf names from baobab-dev/config/capabilities.yaml.
  # Do NOT put Baobab domain capability keys here.
  required_capabilities:
    - "development.docker"
    - "development.github_cli"
    - "database.postgresql"
    - "utilities.jq"
    - "utilities.yq"

notes:
  - "Go toolchains for internal/provider and internal/migration are layered (devcontainer/host) until baobab-dev publishes a native Go profile; repository.yaml still declares the go technical capability for Foundation reproducibility (go.mod + go.sum)."
  - "Local stacks: docker-compose.yml (Keycloak, legacy) and docker-compose.ory.yml (Kratos/Hydra, migration path). Both need Docker and PostgreSQL."
  - "Do not declare languages.go under required_capabilities unless baobab-dev supplies it for the selected profile."
