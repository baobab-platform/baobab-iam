metadata:
  title: Baobab IAM Capability Matrix
  purpose: ADR-IAM-0033 target capability ownership and migration baseline; architectural allocation is not a runtime
    provider registry or activation evidence.
  authority: Baobab Shared contracts and Control Plane resolution own capability meaning; IAM owns the provider-neutral
    interface and adapter mechanics. PLATFORM_RESOLVABLE_CAPABILITY may only be assigned to keys that exist in the
    pinned Shared capability catalogue. All other rows are management, candidate, or provider-internal until a Shared
    catalogue decision. ADR-IAM-0033 retains Keycloak only for enterprise federation; Kratos owns native humans
    and Hydra owns OAuth/workloads. These target allocations do not select providers at runtime.
  updated: '2026-10-04'
  shared_catalogue_rule: At the Shared pin used by this branch only identity.authentication.perform and identity.workload-token.issue
    are catalogued. Do not promote any other key to PLATFORM_RESOLVABLE_CAPABILITY without a Shared catalogue change.
capabilities:
- capability_family: Authentication
  capability_operation: identity.authentication.perform
  classification: PLATFORM_RESOLVABLE_CAPABILITY
  tier: Tier 0
  owning_adr: ADR-IAM-0019, ADR-IAM-0023, ADR-IAM-0024, ADR-IAM-0033
  shared_contract: Standard OIDC/OAuth login contract (catalogued)
  iam_port: Provider-neutral IAM auth boundary
  primary_provider: Ory Kratos (native authentication); Keycloak (enterprise federation only)
  ory_mechanism: Ory Kratos login + Hydra/OIDC issuance
  keycloak_source: Keycloak realm login flows and MFA
  cp_dependency: CP resolves canonical identity and assurance from issuer+subject
  digital_estate_dependency: Estate BFF owns browser session boundary
  observability: Auth success/failure, ACR/AMR, session establishment metrics
  security_requirements: PKCE, state/nonce, redirect URI exact match, no implicit flow
  retirement_dependency: Legacy native Keycloak authentication binding after per-capability evidence; retain enterprise
    federation
  migration_phase: Phase B / C
  implementation_status: Partial
  tests: Auth flow and validation tests
  conformance_evidence: OIDC discovery, PKCE/state/nonce validation evidence
- capability_family: Workload Identity
  capability_operation: identity.workload-token.issue
  classification: PLATFORM_RESOLVABLE_CAPABILITY
  tier: Tier 0
  owning_adr: ADR-IAM-0019, ADR-IAM-0021, ADR-IAM-0022, ADR-IAM-0033
  shared_contract: Canonical workload identity contract (catalogued)
  iam_port: WorkloadProvisioner / FederatedWorkloadProvisioner
  primary_provider: Ory Hydra
  ory_mechanism: Hydra OAuth client issuance and JWT bearer federation
  keycloak_source: Keycloak client credentials / realm clients
  cp_dependency: CP owns workload binding and capability grant
  digital_estate_dependency: Domain engines consume workload tokens and enforce audience/scope
  observability: Token issue rate, grant type, audience/scope denial counters
  security_requirements: Federated-first (RFC 7523); no static secret for platform workloads; Shared scopes only
  retirement_dependency: Legacy Keycloak workload bindings after actual-consumer evidence; retain federation runtime
  migration_phase: Phase B / C
  implementation_status: 'Partial (governed Hydra issuance and historical CP verifier proof; PR #63 merged current-route
    fixture proof; activation and M4-F still unproven)'
  tests: Ory Hydra workload tests
  conformance_evidence: Client secret and federated JWT trust validation
- capability_family: Human Identity Lifecycle
  capability_operation: identity.human.provision
  classification: IAM_MANAGEMENT_OPERATION
  tier: Tier 0
  owning_adr: ADR-IAM-0019, ADR-IAM-0020, ADR-IAM-0022, ADR-IAM-0033
  shared_contract: Shared identity contract; no tenant/legal-entity semantics in IAM traits; key not yet catalogued
    as platform capability
  iam_port: IdentityProvisioner / ProviderIdentity
  primary_provider: Ory Kratos
  ory_mechanism: Kratos identity creation and import
  keycloak_source: Keycloak realm-user creation/import
  cp_dependency: CanonicalIdentity mapping in Control Plane
  digital_estate_dependency: Digital estates consume the resulting subject identity, not a provider-native user
    object
  observability: Provision success/failure, import path, orphan rate
  security_requirements: No business roles in traits; issuer+subject identity only
  retirement_dependency: Legacy Keycloak native provisioning bindings after human migration evidence; retain federated
    identities
  migration_phase: Phase B / C
  implementation_status: Partial
  tests: Provider validation and migration bridge tests
  conformance_evidence: Provider-neutral validation plus migration ledger evidence
- capability_family: Human Identity Lifecycle
  capability_operation: identity.human.disable
  classification: IAM_MANAGEMENT_OPERATION
  tier: Tier 0
  owning_adr: ADR-IAM-0016, ADR-IAM-0020, ADR-IAM-0022, ADR-IAM-0033
  shared_contract: Admin lifecycle contract only; not a business role
  iam_port: IdentityLifecycleManager
  primary_provider: Capability-assigned providers
  ory_mechanism: Kratos admin disable + session kill-switch
  keycloak_source: Keycloak user disable / session logout
  cp_dependency: CP membership revocation remains separate
  digital_estate_dependency: Estate clients rely on the CP authorization path
  observability: Disable/enable events, concurrent session kill count
  security_requirements: Fail-closed when disable cannot be confirmed
  retirement_dependency: Legacy native binding only after kill-switch parity; retain federation containment
  migration_phase: Phase C
  implementation_status: Partial
  tests: Kill-switch tests
  conformance_evidence: Admin disable + session kill-switch evidence
- capability_family: Authentication Assurance
  capability_operation: identity.authentication.assurance
  classification: CANDIDATE_PLATFORM_CAPABILITY
  tier: Tier 0
  owning_adr: ADR-IAM-0024, ADR-IAM-0033
  shared_contract: Assurance model in identity contract; not yet a Shared catalogue key
  iam_port: IAM assurance boundary
  primary_provider: Baobab IAM normalization across assigned providers
  ory_mechanism: Kratos / Ory security policy and ACR/AMR claims
  keycloak_source: Keycloak realm-level MFA and role-based flows
  cp_dependency: CP policy decides operation-level assurance need
  digital_estate_dependency: Estate front-end requests step-up according to domain policy
  observability: ACR/AMR distribution, step-up success rate
  security_requirements: ACR values must map to documented assurance levels
  retirement_dependency: Legacy native MFA flows after assurance parity; retain enterprise assurance evidence
  migration_phase: Phase C
  implementation_status: Partial
  tests: Assurance and session tests
  conformance_evidence: ACR/AMR propagation and policy mapping evidence
- capability_family: Session Security
  capability_operation: identity.session.revoke
  classification: IAM_MANAGEMENT_OPERATION
  tier: Tier 0
  owning_adr: ADR-IAM-0016, ADR-IAM-0023, ADR-IAM-0033
  shared_contract: Session contract is provider-neutral
  iam_port: SessionRevoker
  primary_provider: Capability-assigned providers
  ory_mechanism: Kratos session revocation and Hydra logout flow
  keycloak_source: Keycloak logout and session invalidation
  cp_dependency: CP revocation bound to canonical identity and context
  digital_estate_dependency: Estate BFF manages secure browser session lifecycle
  observability: Session revoke latency, global logout coverage
  security_requirements: Revocation must be effective for already-issued sessions where protocol allows
  retirement_dependency: Legacy native sessions after session evidence; retain federation sessions and coordinated
    logout
  migration_phase: Phase C
  implementation_status: Partial
  tests: Session kill-switch tests
  conformance_evidence: Revoke sessions + global logout evidence
- capability_family: OAuth / OIDC
  capability_operation: identity.token.issuance
  classification: CANDIDATE_PLATFORM_CAPABILITY
  tier: Tier 0
  owning_adr: ADR-IAM-0019, ADR-IAM-0021, ADR-IAM-0033
  shared_contract: OIDC/OAuth standards contract; issuance mechanics are not a separate Shared catalogue key today
  iam_port: Provider-neutral OAuth/OIDC boundary
  primary_provider: Ory Hydra
  ory_mechanism: Hydra token issuance and JWKS publication
  keycloak_source: Keycloak realm client and token issuance
  cp_dependency: CP resolves audience and canonical subject
  digital_estate_dependency: Estate resource servers validate tokens
  observability: Token mint rate by grant type, JWKS freshness
  security_requirements: Audience/scope binding; short-lived access tokens preferred
  retirement_dependency: Legacy general OAuth/token bindings after issuer cutover evidence; retain federation protocol
    signing keys
  migration_phase: Phase B / C
  implementation_status: Partial
  tests: Provider token and client tests
  conformance_evidence: Discovery, JWKS, PKCE and audience handling
- capability_family: Workload Identity
  capability_operation: identity.workload.provision
  classification: IAM_MANAGEMENT_OPERATION
  tier: Tier 1
  owning_adr: ADR-IAM-0019, ADR-IAM-0020, ADR-IAM-0033
  shared_contract: Workload registration contract; no business authorization
  iam_port: WorkloadProvisioner
  primary_provider: Ory Hydra
  ory_mechanism: Hydra client registration
  keycloak_source: Keycloak client provisioning
  cp_dependency: CP workload registration remains separate from provider mechanics
  digital_estate_dependency: Estate workload config relies on stable logical client IDs
  observability: Provision/rotate counts, allow-list hits for M4-C
  security_requirements: Federated-first; ClientSecretAllowList fail-closed; Shared scopes only
  retirement_dependency: Legacy workload provisioning bindings after M4 acceptance; retain Keycloak federation
  migration_phase: Phase B / C
  implementation_status: Partial
  tests: Provision + rotate tests
  conformance_evidence: Logical client ID stability and scope enforcement
- capability_family: Enterprise Federation
  capability_operation: identity.federation.enterprise
  classification: CANDIDATE_PLATFORM_CAPABILITY
  tier: Tier 1
  owning_adr: ADR-IAM-0026, ADR-IAM-0033
  shared_contract: Federation contract; not yet a Shared catalogue key
  iam_port: EnterpriseFederationProvider (planned; not implemented)
  primary_provider: Keycloak
  ory_mechanism: Not required for initial self-hosted enterprise federation; native identities remain Kratos-owned
  keycloak_source: Retained enterprise SAML/OIDC IdPs, identity brokering and provider-local Organization routing
  cp_dependency: CP canonical identity and membership mapping remain authoritative
  digital_estate_dependency: Estate uses identity claims only as external identity evidence
  observability: External IdP auth volume, mapping failure rate
  security_requirements: Approved FederationTrust; exact issuer+subject; no email linking or group-derived business
    authority; assurance provenance
  retirement_dependency: NONE (retained federation capability; replacement requires portability evidence)
  migration_phase: IAM-MP2 / MP7–MP12
  implementation_status: Planned (retained runtime exists; permanent federation adapter and Shared binding contract
    missing)
  tests: Federation contract tests
  conformance_evidence: 'Required: SAML/OIDC federation, binding isolation, disabled trust, key rotation, logout
    and canonical normalization evidence'
- capability_family: Recovery and Proofing
  capability_operation: identity.recovery.perform
  classification: IAM_MANAGEMENT_OPERATION
  tier: Tier 1
  owning_adr: ADR-IAM-0025, ADR-IAM-0033
  shared_contract: Recovery and verification evidence contract
  iam_port: IAM recovery boundary
  primary_provider: Ory Kratos
  ory_mechanism: Kratos recovery flows and verification states
  keycloak_source: Keycloak recovery flows
  cp_dependency: CP decides whether recovered account changes authority
  digital_estate_dependency: Estate UX orchestrates user recovery flow
  observability: Recovery initiation/completion, throttle events
  security_requirements: Rate limiting; proof-of-possession where required
  retirement_dependency: Legacy native recovery binding after proofing parity; enterprise IdP recovery remains upstream
  migration_phase: Phase C
  implementation_status: Partial
  tests: Recovery flow tests
  conformance_evidence: Recovery tokens, throttling and audit evidence
- capability_family: Security Operations
  capability_operation: identity.security.revoke
  classification: IAM_MANAGEMENT_OPERATION
  tier: Tier 1
  owning_adr: ADR-IAM-0029, ADR-IAM-0031, ADR-IAM-0033
  shared_contract: Security event and revocation contract
  iam_port: Kill-switch boundary
  primary_provider: Baobab IAM orchestration across assigned providers
  ory_mechanism: Kratos/Hydra revocation and security operations hooks
  keycloak_source: Keycloak admin events and logout actions
  cp_dependency: CP and domain engines enforce business-authority removal
  digital_estate_dependency: Estates rely on standardized security signals and audit flow
  observability: Bulk revoke latency, incomplete-revoke alarms
  security_requirements: Independent kill-switch outside compromised IAM component (ADR-IAM-0029)
  retirement_dependency: Legacy native event path only after parity; retain and normalize federation events
  migration_phase: Phase C / D
  implementation_status: Partial
  tests: Kill-switch tests
  conformance_evidence: Bulk revocation and incident-response evidence
- capability_family: Privacy / Lifecycle Governance
  capability_operation: identity.human.anonymise
  classification: IAM_MANAGEMENT_OPERATION
  tier: Tier 1
  owning_adr: ADR-IAM-0030, ADR-IAM-0033
  shared_contract: Retention / erasure contract
  iam_port: IAM lifecycle boundary
  primary_provider: Capability-assigned providers
  ory_mechanism: Kratos identity lifecycle and data minimization strategy
  keycloak_source: Keycloak user deletion / disable flows
  cp_dependency: CP and domain engines preserve legal and operational evidence obligations
  digital_estate_dependency: Estates do not conflate IAM profile removal with domain-data erasure
  observability: Anonymise/erasure request completion
  security_requirements: Legal hold awareness; audit trail retained where required
  retirement_dependency: Legacy native data after retention/privacy proof; minimize retained federation data
  migration_phase: Phase C
  implementation_status: Partial
  tests: Lifecycle governance tests
  conformance_evidence: PII minimization and retention evidence
- capability_family: Operational Identity Platform
  capability_operation: identity.migration.ledger
  classification: IAM_MANAGEMENT_OPERATION
  tier: Tier 0
  owning_adr: ADR-IAM-0022, ADR-IAM-0033
  shared_contract: Migration ledger is IAM domain state; CanonicalIdentity remains CP-owned
  iam_port: DiscoveryPort / CanonicalResolver / ProvisionBridge / PhaseCPolicyGate
  primary_provider: Baobab IAM
  ory_mechanism: N/A (ledger is provider-neutral)
  keycloak_source: N/A (source discovery only)
  cp_dependency: CP is system of record for CanonicalIdentity; ledger never fabricates canonical IDs
  digital_estate_dependency: Estates do not read migration ledger state for runtime authorization
  observability: State transition rates, orphan count, dual-run drift signals
  security_requirements: Fail-closed store errors; issuer+subject identity key; deny CUTOVER by default
  retirement_dependency: Ledger retained as evidence after capability-specific LEGACY_RETIRED; no global provider
    deletion
  migration_phase: Phase C
  implementation_status: Partial
  tests: Migration service, bridge, and policy-gate tests
  conformance_evidence: State machine + PolicyGate deny-by-default evidence
- capability_family: Operational Identity Platform
  capability_operation: identity.provider.ready
  classification: PROVIDER_INTERNAL_OPERATION
  tier: Tier 0
  owning_adr: ADR-IAM-0020, ADR-IAM-0021, ADR-IAM-0033
  shared_contract: Provider readiness is not a platform capability
  iam_port: Adapter.CheckReady / provider.IsUnavailable
  primary_provider: Capability-assigned providers
  ory_mechanism: Kratos/Hydra health and ready probes
  keycloak_source: Keycloak health endpoints
  cp_dependency: None for readiness probes
  digital_estate_dependency: None
  observability: Ready/not-ready probe results, version pin match
  security_requirements: Digest-pinned images; fail closed when probe fails
  retirement_dependency: NONE (readiness applies to every retained provider)
  migration_phase: Phase B
  implementation_status: Partial
  tests: ORY_SMOKE / httptest readiness tests
  conformance_evidence: Digest-pinned Compose + CheckReady evidence
- capability_family: Provider Abstraction
  capability_operation: provider.adapter.normalize
  classification: PROVIDER_INTERNAL_OPERATION
  tier: Tier 0
  owning_adr: ADR-IAM-0020, ADR-IAM-0021, ADR-IAM-0033
  shared_contract: Provider-neutral IAM contract
  iam_port: internal/provider and adapter boundary
  primary_provider: Baobab IAM adapters across assigned providers
  ory_mechanism: Ory adapter normalization only; no leakage of provider semantics
  keycloak_source: Permanent bounded federation adapter planned; legacy compatibility methods remain unsupported
  cp_dependency: CP resolves canonical identity externally to provider-native IDs
  digital_estate_dependency: Estate layers depend on normalized contracts, not provider SDKs
  observability: Adapter error taxonomy, unsupported-operation rate
  security_requirements: No provider-native IDs in Baobab contracts; scope normalization fail-closed
  retirement_dependency: NONE (Keycloak federation adapter remains permanent and replaceable)
  migration_phase: Phase B / C
  implementation_status: Partial
  tests: Provider adapter tests
  conformance_evidence: No provider-native canonical IDs allowed in Baobab contracts
