name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# NOTE: Foundation Repository Gates run via the separately-maintained
# .github/workflows/foundation.yml (pinned to nabhold/shared's v1.2.0 tag).
# This file previously also declared its own "foundation" job pointing at a
# nonexistent workflow path (foundation-gates.yml vs. the real
# foundation-repository-gates.yml) with an unresolved "<SHA>" placeholder;
# that job never could have run. Removed rather than fixed in place to
# avoid maintaining the same gate twice.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: baobab-iam:test
      # A standalone `docker run` health check was previously attempted here,
      # but this image's CMD runs Keycloak in production mode ("start", not
      # "start-dev"), which requires a reachable PostgreSQL database to ever
      # reach /health/ready — a bare `docker run` with no database would
      # just hang until the curl timeout. The integration-test job below
      # runs the full docker-compose stack (with Postgres) and is where
      # boot/health/bootstrap is actually exercised.
      - name: Security scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: baobab-iam:test
          severity: CRITICAL,HIGH
          format: table
      # Gate IAM-16 (Production Hardening): §219's checklist requires an
      # SBOM, and nothing in this repo or nabhold/shared's reusable
      # foundation gates generated one before this -- both only ran Trivy in
      # vulnerability/secret-scan mode. Reusing the same already-approved
      # trivy-action (no new third-party action to vet) in cyclonedx mode
      # produces a real software bill of materials for the exact image this
      # job just built, uploaded as a build artifact so it survives the run.
      - name: Generate SBOM (Trivy, CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: baobab-iam:test
          format: cyclonedx
          output: sbom.cyclonedx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baobab-iam-sbom
          path: sbom.cyclonedx.json
          retention-days: 90

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOOTSTRAP_WORKLOAD_CLIENT_SECRET: ci-test-only-secret-do-not-use-in-prod
      KC_URL: http://localhost:8080
      # Keycloak 26 serves health/metrics on a separate management
      # interface (port 9000 by default), not the main HTTP port —
      # see https://www.keycloak.org/server/management-interface.
      KC_MANAGEMENT_URL: http://localhost:9000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start stack
        run: docker compose up -d --build
      - name: Wait for Keycloak to accept connections
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "$KC_MANAGEMENT_URL/health/ready"; then
              echo "Keycloak is ready."
              exit 0
            fi
            sleep 5
          done
          echo "Keycloak did not become ready in time." >&2
          docker compose logs keycloak
          exit 1
      - name: Bootstrap realm (ADR-0002 configuration-as-code)
        run: |
          docker compose exec -T \
            -e "BOOTSTRAP_WORKLOAD_CLIENT_SECRET=$BOOTSTRAP_WORKLOAD_CLIENT_SECRET" \
            keycloak /opt/keycloak/bootstrap.sh
      - name: Run ADR-0002 Section 48 verification suite
        run: ./tests/integration/run.sh
      - name: Dump Keycloak logs on failure
        if: failure()
        run: docker compose logs keycloak
      - name: Tear down
        if: always()
        run: docker compose down -v
