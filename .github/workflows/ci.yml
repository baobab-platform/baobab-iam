name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  provider-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build packages
        run: go build ./internal/provider/... ./internal/migration/... ./cmd/provision-workload/
      - name: Test packages
        run: go test ./internal/provider/... ./internal/migration/... ./cmd/provision-workload ./cmd/provision-federated-workload -count=1
      - name: Every issued scope exists in the pinned Shared scope registry
        run: ./scripts/check-issued-scopes.sh
      - name: Every client and scope description fits Keycloak's 255-character limit
        run: ./scripts/check-config-limits.sh

  keycloak-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify pinned Keycloak digest and record vendored libraries
        run: scripts/keycloak-baseline.sh
      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keycloak-baseline-evidence
          path: keycloak-baseline-evidence/
          retention-days: 90

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - name: Build image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          push: false
          load: true
          tags: baobab-iam:test
      - name: Security scan (Trivy)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: baobab-iam:test
          severity: CRITICAL,HIGH
          format: table
      - name: Generate SBOM (Trivy, CycloneDX)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: baobab-iam:test
          format: cyclonedx
          output: sbom.cyclonedx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baobab-iam-sbom
          path: sbom.cyclonedx.json
          retention-days: 90

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOOTSTRAP_WORKLOAD_CLIENT_SECRET: ci-test-only-secret-do-not-use-in-prod
      KC_URL: http://localhost:8080
      KC_MANAGEMENT_URL: http://localhost:9000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build and start stack
        run: docker compose up -d --build
      - name: Wait for Keycloak to accept connections
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "$KC_MANAGEMENT_URL/health/ready"; then
              echo "Keycloak is ready."
              exit 0
            fi
            sleep 5
          done
          echo "Keycloak did not become ready in time." >&2
          docker compose logs keycloak
          exit 1
      - name: Bootstrap realm (ADR-0002 configuration-as-code)
        run: |
          docker compose exec -T \
            -e "BOOTSTRAP_WORKLOAD_CLIENT_SECRET=$BOOTSTRAP_WORKLOAD_CLIENT_SECRET" \
            keycloak /opt/keycloak/bootstrap.sh
      - name: Run ADR-0002 Section 48 verification suite
        run: ./tests/integration/run.sh
      - name: Dump Keycloak logs on failure
        if: failure()
        run: docker compose logs keycloak
      - name: Tear down
        if: always()
        run: docker compose down -v
