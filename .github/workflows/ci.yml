name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  provider-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify configured browser themes are packaged
        run: |
          python3 scripts/check_theme_inventory.py
          python3 -m unittest discover -s tests/unit -p 'test_theme_inventory.py'
      - name: Verify browser primary authentication precedes assurance
        run: |
          python3 scripts/check_browser_flow.py
          python3 -m unittest discover -s tests/unit -p 'test_browser_flow*.py'
          bash -n scripts/reconcile_browser_primary.sh
      - name: Verify local bootstrap credential security
        run: python3 -m unittest discover -s tests/unit -p 'test_local_bootstrap_env.py'
      - name: Validate dormant Nabhold human CP profile and negative contracts
        run: |
          python3 scripts/verify_nabhold_human_cp.py
          python3 -m unittest discover -s tests/unit -p 'test_nabhold_human_cp.py'
      - name: Enforce Go formatting across release source
        run: |
          gofmt -d cmd internal
          test -z "$(gofmt -l cmd internal)"
      - name: Build packages
        run: go build ./cmd/native-browser-bff/ ./internal/assurance/... ./internal/securityops/... ./internal/nativebff/... ./internal/humanauth/... ./internal/provider/... ./internal/migration/... ./internal/federation/... ./cmd/provision-workload/ ./cmd/provision-federated-workload/ ./cmd/migrate-ledger-provision/ ./cmd/federation-authority/ ./cmd/c4-03-qualify/ ./cmd/c4-04-readiness/
      - name: Test packages
        run: go test ./internal/assurance/... ./internal/securityops/... ./internal/nativebff/... ./internal/humanauth/... ./internal/provider/... ./internal/migration/... ./internal/federation/... ./cmd/provision-workload ./cmd/provision-federated-workload ./cmd/migrate-ledger-provision ./cmd/federation-authority ./cmd/c4-03-qualify ./cmd/c4-04-readiness -count=1
      - name: Validate IAM-N02 browser/evidence source and negative custody gates
        run: |
          python3 -m py_compile tests/browser/n02_live.py scripts/n02_evidence_gate.py scripts/n02_development_clients.py
          python3 -B -m unittest discover -s tests/unit -p 'test_n02_evidence_gate.py' -v
          python3 -B -m unittest discover -s tests/unit -p 'test_n02_browser_source.py' -v
          python3 -B -m unittest discover -s tests/unit -p 'test_n02_development_clients.py' -v
      - name: IAM-N07 connected-consumer and real-browser source negatives (not live acceptance)
        run: |
          python3 -B -m py_compile scripts/n07_connected_consumers.py tests/browser/n07_estates_live.py
          python3 -B -m unittest discover -s tests/unit -p 'test_n07_connected_consumers.py' -v
          python3 -B -m unittest discover -s tests/unit -p 'test_n07_estate_browser_source.py' -v
      - name: IAM-N08 native Go source and supply-chain negatives
        run: |
          python3 -B scripts/n08_verify_supply_chain.py
          python3 -B -m unittest discover -s tests/unit -p 'test_n08_native_supply_chain.py' -v
          go test -race ./internal/nativebff ./cmd/native-browser-bff -run '^TestN08' -count=1
      - name: Test federation and native browser boundaries with race detector
        run: go test -race ./internal/federation/... ./internal/nativebff/... -count=1
      - name: Install matrix validator dependency
        run: python3 -m pip install PyYAML==6.0.3
      - name: Verify IAM-N01 ADR precedence, immutable Shared pin and development boundary
        run: |
          python3 scripts/check_iam_n01.py
          python3 -m unittest discover -s tests/unit -p 'test_iam_n01.py'
      - name: Verify independent development CMS fixture boundaries
        run: |
          python3 -m unittest discover -s tests/unit -p 'test_int03_cms_fixture.py'
          bash -n tests/integration/run.sh
      - name: Validate capability matrix and generated documentation against pinned Shared
        env:
          GH_TOKEN: ${{ secrets.SHARED_READ_TOKEN || github.token }}
        run: |
          python3 scripts/iam_capability_matrix.py
          python3 -m unittest discover -s tests/unit -p 'test_iam_capability_matrix.py'
          python3 -m unittest discover -s tests/unit -p 'test_authority_admission.py'
          python3 -m unittest discover -s tests/unit -p 'test_p_cap_07_pulse_resource_authority.py'
      - name: Read approved Shared federation pin
        id: federation-pin
        run: python3 -c 'import os,yaml; p=yaml.safe_load(open("contracts.lock.yaml"))["source"]["commit"]; f=open(os.environ["GITHUB_OUTPUT"],"a"); print("commit="+p,file=f)'
      - name: Checkout approved Shared federation contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: baobab-platform/shared
          token: ${{ secrets.SHARED_READ_TOKEN || github.token }}
          persist-credentials: false
          ref: ${{ steps.federation-pin.outputs.commit }}
          path: .shared-contracts
      - name: Install pinned Shared schema runtime
        run: python3 -m pip install -r .shared-contracts/.github/foundation-tests/requirements.txt
      - name: Validate pinned federation contract consumption
        env:
          GH_TOKEN: ${{ secrets.SHARED_READ_TOKEN || github.token }}
        run: |
          gofmt -d internal/federation
          test -z "$(gofmt -l internal/federation)"
          python3 scripts/check-federation-contracts.py
      - name: Validate provider declarations against approved Shared contracts
        run: python3 .shared-contracts/scripts/capability_catalogue.py validate-declaration .baobab/capability-provider.yaml --engine-id baobab-iam --repository-root .
      - name: Verify registration publication exclusions and drift detection
        env:
          SHARED_REPO_DIR: .shared-contracts
        run: |
          go run ./cmd/provider-support-census > /tmp/iam-executable-support.json
          python3 scripts/provider_publication.py --shared-checkout .shared-contracts --executable-support-export /tmp/iam-executable-support.json
          python3 -m unittest discover -s tests/unit -p 'test_provider_publication.py'
          python3 -m unittest discover -s tests/unit -p 'test_runtime_profile_publication.py'
          python3 -m unittest discover -s tests/unit -p 'test_canonical_workload_request.py'
          python3 -m unittest discover -s tests/unit -p 'test_canonical_human_auth.py'
          go test -race ./internal/humanauth ./internal/tokenprofile ./internal/provider/ory ./cmd/ory-token-profile-hook -count=1
      - name: Every issued scope exists in the pinned Shared scope registry
        run: ./scripts/check-issued-scopes.sh
      - name: Every client and scope description fits Keycloak's 255-character limit
        run: ./scripts/check-config-limits.sh

  iam-n06-postgres17-security:
    name: IAM-N06 isolated PostgreSQL 17 security and assurance negatives
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: n06_ci
          POSTGRES_USER: n06_ci
          POSTGRES_PASSWORD: "n06-disposable-${{ github.run_id }}"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U n06_ci -d n06_ci"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    env:
      IAM_N06_DISPOSABLE_PG: "1"
      IAM_N06_TEST_DATABASE_URL: "postgres://n06_ci:n06-disposable-${{ github.run_id }}@127.0.0.1:5432/n06_ci?sslmode=disable"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify N06 Go style and migration-backed security operations
        run: |
          test -z "$(gofmt -l internal/assurance internal/securityops internal/nativebff/n06_*.go)"
          go test ./internal/assurance ./internal/securityops ./internal/nativebff -run 'TestN06' -count=1 -v
      - name: Race-check real security ledger and credential-change negatives
        run: go test -race ./internal/securityops ./internal/assurance -run 'TestN06' -count=1
      - name: IAM-N08 real PostgreSQL 17 backup restore and replay fencing
        env:
          IAM_N08_DISPOSABLE_PG: "1"
          IAM_N08_DATABASE_NAME: n06_ci
          IAM_N08_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash tests/operations/n08_postgres_restore_replay.sh

  enterprise-federation-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare isolated enterprise TLS fixtures
        run: tests/enterprise/prepare.sh
      - name: Start pinned Keycloak enterprise stack
        run: docker compose -f tests/enterprise/docker-compose.yml up -d --build
      - name: Wait for enterprise Keycloak
        run: |
          for i in $(seq 1 60); do
            if curl --cacert tests/enterprise/tls/ca.crt -sf -o /dev/null https://localhost:9000/health/ready; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Prove actual OIDC and SAML brokering with private evidence
        env:
          KEYCLOAK_ENTERPRISE_LIVE_URL: https://localhost:8443
          KEYCLOAK_ENTERPRISE_TLS_DIR: ${{ github.workspace }}/tests/enterprise/tls
        run: go test -v ./internal/provider/keycloak -run TestLiveKeycloakEnterpriseBroker -count=1
      - name: Dump enterprise stack diagnostics on failure
        if: failure()
        run: docker compose -f tests/enterprise/docker-compose.yml logs --tail=150
      - name: Tear down enterprise stack
        if: always()
        run: docker compose -f tests/enterprise/docker-compose.yml down -v

  federation-authority-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build private federation authority image
        run: docker build -f Dockerfile.federation-authority -t federation-authority:test .
      - name: Scan federation authority image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: federation-authority:test
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table
      - name: Generate federation authority SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: federation-authority:test
          format: cyclonedx
          output: federation-authority.cyclonedx.json
      - name: Upload federation authority SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: federation-authority-sbom
          path: federation-authority.cyclonedx.json
          retention-days: 90

  keycloak-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify pinned Keycloak digest and record vendored libraries
        run: scripts/keycloak-baseline.sh
      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keycloak-baseline-evidence
          path: keycloak-baseline-evidence/
          retention-days: 90

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: baobab-iam:test
      - name: Security scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: baobab-iam:test
          severity: CRITICAL,HIGH
          format: table
      - name: Generate SBOM (Trivy, CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: baobab-iam:test
          format: cyclonedx
          output: sbom.cyclonedx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baobab-iam-sbom
          path: sbom.cyclonedx.json
          retention-days: 90

  # Keycloak baseline verification suite (ADR-0002 §48).
  # Restores full fixture lifecycle required by tests/integration/run.sh:
  # secret env, Compose up, readiness, realm bootstrap, suite, logs, teardown.
  integration-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser_fixture: [fresh, legacy, primary]
    env:
      BOOTSTRAP_WORKLOAD_CLIENT_SECRET: ci-test-only-secret-do-not-use-in-prod
      KC_URL: http://localhost:8080
      KC_MANAGEMENT_URL: http://localhost:9000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node for real WebAuthn browser qualification
        uses: actions/setup-node@db0fb3a98ed314b69026b6e8c9be26a7e2fe65a8
        with:
          node-version: '24'
      - name: Install pinned passkey qualification runtime and Chromium
        run: |
          npm ci --prefix tests/integration/passkey --ignore-scripts
          npm test --prefix tests/integration/passkey
          node tests/integration/passkey/node_modules/playwright/cli.js install --with-deps chromium
      - name: Prepare fresh isolated provider credentials
        shell: bash
        run: |
          set +x
          python3 scripts/local_bootstrap_env.py --environment ci
          set -a
          source .env
          set +a
          for name in KEYCLOAK_ADMIN KEYCLOAK_ADMIN_PASSWORD POSTGRES_PASSWORD; do
            printf '::add-mask::%s\n' "${!name}"
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
      - name: Prepare isolated legacy browser hierarchy
        if: matrix.browser_fixture != 'fresh'
        run: |
          python3 tests/integration/prepare_legacy_browser.py "${{ matrix.browser_fixture }}"
          echo 'COMPOSE_FILE=docker-compose.yml:tests/integration/.runtime/browser.override.json' >> "$GITHUB_ENV"
      - name: Build and start stack
        run: docker compose up -d --build
      - name: Wait for Keycloak to accept connections
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "$KC_MANAGEMENT_URL/health/ready"; then
              echo "Keycloak is ready."
              exit 0
            fi
            sleep 5
          done
          echo "Keycloak did not become ready in time." >&2
          docker compose logs keycloak
          exit 1
      - name: Bootstrap realm (ADR-0002 configuration-as-code)
        run: |
          docker compose exec -T \
            -e "BOOTSTRAP_WORKLOAD_CLIENT_SECRET=$BOOTSTRAP_WORKLOAD_CLIENT_SECRET" \
            keycloak /opt/keycloak/bootstrap.sh
      - name: Run ADR-0002 Section 48 verification suite
        run: ./tests/integration/run.sh
      - name: Retain sanitized passkey ceremony evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: passkey-browser-${{ matrix.browser_fixture }}
          path: tests/integration/.runtime/passkey-evidence/run-*/receipt*
          if-no-files-found: error
          retention-days: 30
      - name: Dump Keycloak logs on failure
        if: failure()
        run: docker compose logs keycloak
      - name: Tear down
        if: always()
        run: docker compose down -v

  # Preserve the existing required-check name while requiring ALL actual
  # Keycloak paths. A failed/cancelled variant cannot become an aggregate pass.
  integration-test:
    needs: [integration-variants]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require fresh import and persistent-realm repair
        env:
          VARIANTS_RESULT: ${{ needs.integration-variants.result }}
        run: test "$VARIANTS_RESULT" = success

  federation-postgres:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: federation_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Shared-state concurrency, replay and recovery fences
        env:
          TEST_FEDERATION_DATABASE_URL: postgres://postgres@localhost:5432/federation_ci?sslmode=disable
          POSTGRES_TOOLS_CONTAINER: ${{ job.services.postgres.id }}
        run: go test -race ./internal/federation -run TestPostgres -count=1 -v
      - name: Encrypted BFF PostgreSQL 17 session and replay qualification
        env:
          TEST_NATIVE_BFF_DATABASE_URL: postgres://postgres@localhost:5432/federation_ci?sslmode=disable
        run: go test -race ./internal/nativebff -run TestPostgres -count=1 -v
