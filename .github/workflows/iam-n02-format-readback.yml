name: IAM-N02 temporary read-only gofmt transport

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  format-readback:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/iam-n02-native-browser-bff' && github.event.pull_request.base.ref == 'feat/iam-n01-adr-contract-development-convergence'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read back gofmt result for N02 only
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/nativebff/*.go
          for f in internal/nativebff/*.go; do
            printf 'N02_FORMAT_BEGIN:%s\n' "$f"
            base64 -w0 "$f"
            printf '\nN02_FORMAT_END:%s\n' "$f"
          done
