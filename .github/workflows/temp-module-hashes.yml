name: Temporary audited Go module checksum readback
on:
  pull_request:
permissions:
  contents: read
jobs:
  verified-module-hashes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Record checksum-verified security module entries
        run: |
          set -euo pipefail
          go mod download -json github.com/supatype/saml@v0.7.0
          go mod download -json golang.org/x/net@v0.62.0
          go mod download all
          echo "--- VERIFIED CHANGE FROM EXPLICIT MODULE DOWNLOAD ---"
          git diff -- go.sum go.mod
          # This repository contains a non-module local CP source fixture
          # under tests/consumer/current whose private CP internals cannot
          # be resolved via the public Go proxy. Exclude only that directory
          # from the diagnostic module-graph tidy and restore it immediately.
          temp_dir=$(mktemp -d)
          mv tests/consumer/current "$temp_dir/current"
          trap 'mv "$temp_dir/current" tests/consumer/current; rmdir "$temp_dir"' EXIT
          go mod tidy
          echo "--- VERIFIED FINAL GO MODULE GRAPH DIFF ---"
          git diff -- go.mod go.sum
