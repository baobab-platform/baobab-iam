name: IAM-N08 Native Operational Hardening

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-image:
    name: IAM-N08 pinned native image, source negatives and rootless fail-closed runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify native supply-chain policy and tampering negatives
        run: |
          python3 -B scripts/n08_verify_supply_chain.py
          python3 -B -m unittest discover -s tests/unit -p 'test_n08_native_supply_chain.py' -v
          bash -n tests/operations/n08_postgres_restore_replay.sh
          go mod verify
          go vet ./internal/nativebff/... ./internal/securityops/... ./cmd/native-browser-bff/...
          go test -race ./internal/nativebff ./cmd/native-browser-bff -run '^TestN08' -count=1
          go test ./internal/nativebff -run '^N08_NO_MATCHING_TEST' -bench '^BenchmarkN08SourceOnly' -benchmem -benchtime=200x
      - name: Reproduce two independent same-source native image builds
        run: |
          docker build --pull=false --no-cache --build-arg SOURCE_DATE_EPOCH=0 -f Dockerfile.native-browser-bff -t baobab-iam-native:n08-first .
          docker build --pull=false --no-cache --build-arg SOURCE_DATE_EPOCH=0 -f Dockerfile.native-browser-bff -t baobab-iam-native:n08-second .
          # Classic Docker's image config Creation timestamp is not normalized
          # by SOURCE_DATE_EPOCH. Compare reproducible native binary bytes and
          # security-relevant runtime metadata separately, rather than claiming
          # equal manifest IDs from two differently timestamped image configs.
          for label in first second; do
            id="$(docker create "baobab-iam-native:n08-$label")"
            docker cp "$id:/native-browser-bff" "$RUNNER_TEMP/native-$label"
            docker rm "$id" >/dev/null
            test "$(docker image inspect "baobab-iam-native:n08-$label" --format '{{.Config.User}}')" = "65532:65532"
            test "$(docker image inspect "baobab-iam-native:n08-$label" --format '{{.Config.Entrypoint}}')" = "[/native-browser-bff]"
          done
          cmp -s "$RUNNER_TEMP/native-first" "$RUNNER_TEMP/native-second"
          sha256sum "$RUNNER_TEMP/native-first" "$RUNNER_TEMP/native-second"
          rm -f "$RUNNER_TEMP/native-first" "$RUNNER_TEMP/native-second"
      - name: Rootless read-only native binary denies absent original secrets
        run: |
          set +e
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --user 65532:65532 baobab-iam-native:n08-first > /tmp/n08-native-denial.log 2>&1
          code=$?
          set -e
          test "$code" -eq 2
          grep -q 'DENIED N02 missing reviewed runtime' /tmp/n08-native-denial.log
          rm -f /tmp/n08-native-denial.log
      # Fetch the real vulnerability database from its authoritative GHCR mirror.
      # The default mirror.gcr.io endpoint returned HTTP 429 in final-head CI;
      # no scan, severity or exit-code gate is waived by this source override.
      - name: Scan native image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
        with:
          image-ref: baobab-iam-native:n08-first
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table
      - name: Generate native executable image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: baobab-iam-native:n08-first
          format: cyclonedx
          output: n08-native.cyclonedx.json
      - name: Upload native SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.7.5
        with:
          name: iam-n08-native-sbom
          path: n08-native.cyclonedx.json
          retention-days: 30


  native-provider-pg17-restore:
    name: Real Kratos/Hydra PG17 restore and retained-denial readback
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate disposable recovery scripts
        run: |
          bash -n tests/ory-foundation/run.sh tests/operations/n08_ory_live_restore.sh
          python3 -m py_compile tests/operations/n08_ory_restore_state.py
          python3 -B -m unittest discover -s tests/unit -p 'test_n08_ory_live_restore.py' -v
      - name: Install locked fixture YAML parser
        run: python3 -m pip install PyYAML==6.0.3
      - name: Run actual provider mechanics before restore
        env:
          GH_TOKEN: ${{ secrets.SHARED_READ_TOKEN || github.token }}
        run: bash tests/ory-foundation/run.sh
      - name: Destroy/recreate BOTH disposable provider databases and verify revocation survives
        env:
          ORY_FOUNDATION: "1"
          ORY_KRATOS_ADMIN_URL: http://127.0.0.1:4434
          ORY_KRATOS_PUBLIC_URL: http://127.0.0.1:4433
          ORY_HYDRA_ADMIN_URL: http://127.0.0.1:4445
          ORY_PUBLIC_ISSUER: http://127.0.0.1:4444
        run: bash tests/operations/n08_ory_live_restore.sh
      - name: Tear down all disposable provider volumes
        if: always()
        run: docker compose -p ory-foundation-ci -f docker-compose.ory.yml down -v --remove-orphans

  retained-keycloak-provider-pg17-restore:
    name: Real Keycloak enterprise-provider database restore
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate destructive test is explicit and syntax-valid
        run: |
          bash -n tests/operations/n08_keycloak_database_restore.sh
          python3 -m py_compile tests/operations/n08_keycloak_session_restore.py
      - name: Create disposable TLS keys for Keycloak
        run: bash tests/enterprise/prepare.sh
      - name: Start the original pinned enterprise federation runtime
        run: docker compose -p iam-n08-enterprise-recovery -f tests/enterprise/docker-compose.yml up -d --build
      - name: Wait for enterprise issuer readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --cacert tests/enterprise/tls/ca.crt -fsS --max-time 3                  -o /dev/null https://localhost:9000/health/ready; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Destructively restore original Keycloak PostgreSQL 17 state and restart provider
        env:
          IAM_N08_ENTERPRISE_DISPOSABLE: '1'
        run: bash tests/operations/n08_keycloak_database_restore.sh
      - name: Destroy test-only Keycloak volumes and private TLS
        if: always()
        run: |
          docker compose -p iam-n08-enterprise-recovery -f tests/enterprise/docker-compose.yml down -v --remove-orphans
          sudo rm -rf tests/enterprise/tls
