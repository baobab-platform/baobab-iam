name: Ory Foundation Live

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ory-foundation-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pin validator dependency
        run: python3 -m pip install PyYAML==6.0.3
      - name: Verify isolated pinned foundation and live provider boundary
        run: bash tests/ory-foundation/run.sh
      - name: Collect sanitized runtime evidence
        if: always()
        run: |
          mkdir -p ory-foundation-evidence
          docker compose -p ory-foundation-ci -f docker-compose.ory.yml ps --all > ory-foundation-evidence/services.txt
          docker compose -p ory-foundation-ci -f docker-compose.ory.yml images > ory-foundation-evidence/images.txt
          docker compose -p ory-foundation-ci -f docker-compose.ory.yml logs --no-color 2>&1 | python3 tests/ory-foundation/sanitize_logs.py > ory-foundation-evidence/runtime.log
          cp provider.lock.yaml ory-foundation-evidence/provider.lock.yaml
          printf '%s\n' "$GITHUB_SHA" > ory-foundation-evidence/commit.txt
      - name: Tear down disposable foundation
        if: always()
        run: docker compose -p ory-foundation-ci -f docker-compose.ory.yml down -v --remove-orphans
      - name: Upload foundation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ory-foundation-evidence
          path: ory-foundation-evidence/
          retention-days: 30
          if-no-files-found: error
