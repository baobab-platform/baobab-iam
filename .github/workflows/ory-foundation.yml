name: Ory Foundation Live

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ory-foundation-live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        hydra: [released, audience-backport]
    env:
      ORY_HYDRA_AUDIENCE_CANDIDATE: ${{ matrix.hydra == 'audience-backport' && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build exact upstream audience backport candidate
        if: matrix.hydra == 'audience-backport'
        run: bash tests/ory-foundation/hydra-audience/build.sh
      - name: Generate candidate SBOM
        if: matrix.hydra == 'audience-backport'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: baobab-hydra-audience-candidate:ci
          format: cyclonedx
          output: ory-foundation-evidence/hydra-candidate.cyclonedx.json
      - name: Scan candidate image
        if: matrix.hydra == 'audience-backport'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: baobab-hydra-audience-candidate:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table
      - name: Check M4 Go formatting
        run: |
          if [ -n "$(gofmt -l internal/tokenprofile cmd/ory-token-profile-hook internal/provider/ory/*token_profile*.go internal/provider/ory/workload_live_test.go internal/provider/ory/consumer_live_test.go tests/consumer/cp/main.go tests/consumer/current/main.go internal/provider/ory/context_route_live_test.go)" ]; then
            gofmt -d internal/tokenprofile cmd/ory-token-profile-hook internal/provider/ory/*token_profile*.go internal/provider/ory/workload_live_test.go internal/provider/ory/consumer_live_test.go tests/consumer/cp/main.go tests/consumer/current/main.go internal/provider/ory/context_route_live_test.go
            exit 1
          fi
      - name: Install pin validator dependency
        run: python3 -m pip install PyYAML==6.0.3
      - name: Verify governed Shared projection builder
        run: python3 -m unittest discover -s tests/unit -p 'test_workload_token_profiles.py'
      - name: Verify isolated foundation, live provider boundary and M4 workload mechanics
        env:
          GH_TOKEN: ${{ secrets.SHARED_READ_TOKEN || github.token }}
        run: bash tests/ory-foundation/run.sh
      - name: Check out immutable CP consumer source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: baobab-platform/baobab-cp
          ref: c84063cb07dce76e1ffac4b12fa29c5e4e5ec855
          path: .cp-consumer-source
          token: ${{ secrets.SHARED_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Verify governed workload claims and audience boundaries
        run: bash tests/ory-foundation/token_profile.sh
      - name: Collect sanitized runtime evidence
        if: always()
        run: |
          mkdir -p ory-foundation-evidence
          docker compose -p ory-foundation-ci -f docker-compose.ory.yml ps --all > ory-foundation-evidence/services.txt
          docker compose -p ory-foundation-ci -f docker-compose.ory.yml images > ory-foundation-evidence/images.txt
          docker compose -p ory-foundation-ci -f docker-compose.ory.yml logs --no-color 2>&1 | python3 tests/ory-foundation/sanitize_logs.py > ory-foundation-evidence/runtime.log
          cp provider.lock.yaml ory-foundation-evidence/provider.lock.yaml
          printf '%s\n' "$GITHUB_SHA" > ory-foundation-evidence/commit.txt
      - name: Tear down disposable foundation
        if: always()
        run: docker compose -p ory-foundation-ci -f docker-compose.ory.yml down -v --remove-orphans
      - name: Upload foundation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ory-foundation-evidence-${{ matrix.hydra }}
          path: ory-foundation-evidence/
          retention-days: 30
          if-no-files-found: error

