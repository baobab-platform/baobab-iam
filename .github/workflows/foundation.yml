name: Foundation Repository Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read
  security-events: write

jobs:
  foundation:
    uses: baobab-platform/shared/.github/workflows/foundation-repository-gates.yml@e7e38e367c4f7cb7d5a651554e1708dcb279f8b9 # Shared PR #470 integration qualification
    with:
      foundation_ref: "e7e38e367c4f7cb7d5a651554e1708dcb279f8b9"
      dependency_review_enabled: true
