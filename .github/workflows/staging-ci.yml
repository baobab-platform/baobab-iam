name: Staging Tagged Images
on:
  push:
    tags: ['v*.*.*-staging']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-staging')
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/baobab-platform/baobab-iam-federation-authority
            dockerfile: Dockerfile.federation-authority
          - image: ghcr.io/baobab-platform/baobab-iam
            dockerfile: Dockerfile
    permissions:
      contents: read
      actions: read
      packages: write
      attestations: write
      id-token: write
    uses: baobab-platform/shared/.github/workflows/reusable-staging-image.yml@92541c92321abde72dea7deb7d42e70d0b6acafb # shared main; staging workflows are not in a promoted release (v2.3.0) yet
    with:
      dockerfile: ${{ matrix.dockerfile }}
      image: ${{ matrix.image }}
      go-tests: true
